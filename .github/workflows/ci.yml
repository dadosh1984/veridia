name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    name: Install (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
            ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint (${{ matrix.os }} / node ${{ matrix.node }})
    needs: install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (${{ matrix.os }} / node ${{ matrix.node }})
    needs: install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    name: Test + coverage (${{ matrix.os }} / node ${{ matrix.node }})
    needs: install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --config-loader native 
      - run: pnpm test
      - name: Coverage + threshold enforcement
        # Coverage gate only runs on ubuntu: macOS/Windows have environment-
        # specific skips (PATHEXT, .bat, ...) that drag coverage below the
        # configured thresholds. Running on all six matrix cells would either
        # be flaky or redundant.
        if: matrix.os == 'ubuntu-latest'
        run: pnpm coverage
      - name: Size-limit snapshot
        continue-on-error: true
        run: pnpm size
      - name: Audit dependencies (non-blocking)
        if: always()
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
      - name: Self-dogfooding — develop loop
        run: node dist/cli/index.mjs develop --self

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --config-loader native 
      - name: Publish on version change
        run: |
          LOCAL="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view veridia version 2>/dev/null || echo '')"
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            npm publish --provenance --access public
            git tag "v$LOCAL"
            git push origin "v$LOCAL"
            gh release create "v$LOCAL" --title "v$LOCAL" --generate-notes
          else
            echo "Version $LOCAL already published on npm; skipping publish, tag, and release."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
